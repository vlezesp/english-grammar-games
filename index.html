<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Quest · English Adventure</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#dcecff,#f5e9ff);color:#192744;min-height:100vh;display:grid;place-items:center;padding:18px}.app{background:#fff;width:min(760px,100%);border-radius:24px;box-shadow:0 16px 48px #263a6c26;padding:clamp(20px,4vw,38px)}h1{margin:4px 0 12px;font-size:clamp(28px,5vw,40px)}h2{margin:12px 0}p{line-height:1.5}.muted{color:#53617c}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#edf2ff;border-radius:30px;padding:9px 13px;font-weight:700}.bar{height:13px;border-radius:20px;background:#e8ecf7;overflow:hidden;margin:20px 0}.fill{height:100%;background:#6c59d9;width:0%;transition:width .25s}.options{display:grid;gap:12px;margin:24px 0}.option{background:#f6f7ff;border:2px solid #e1e6ff;color:#1e2d4c;border-radius:14px;padding:16px;text-align:left;font:inherit;font-size:19px;cursor:pointer}.option:hover:not(:disabled){background:#eaeaff}.option:disabled{cursor:default}.correct{border-color:#24a46c!important;background:#e4faef!important}.wrong{border-color:#e15b63!important;background:#fff0f1!important}.primary{background:#6352d7;color:white;border:0;border-radius:13px;padding:14px 20px;font:inherit;font-weight:750;cursor:pointer}.primary:disabled{opacity:.5}.secondary{background:#e9eafd;color:#302e76;border:0;border-radius:13px;padding:14px 20px;font:inherit;font-weight:750;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}.feedback{min-height:60px;font-weight:700}.reward{font-size:42px;margin:14px 0}.small{font-size:14px}.hidden{display:none}.level{color:#6c59d9;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.center{text-align:center}</style></head><body><main class="app" aria-live="polite"><section id="start"><div class="level">English Adventure</div><h1>Grammar Quest 🚀</h1><p>¡Supera las misiones de gramática inglesa, consigue estrellas y desbloquea recompensas!</p><h2>Elige tu aventura</h2><div class="actions"><button class="primary" onclick="startGame(3)">🌱 Segundo ciclo</button><button class="primary" onclick="startGame(6)">🚀 6.º de Primaria</button></div><p class="muted small">Juego individual · Sin registro · Funciona en Chromebook</p></section><section id="game" class="hidden"><div class="top"><span class="pill" id="grade"></span><span class="pill" id="hearts"></span><span class="pill" id="stars"></span></div><div class="bar"><div id="progress" class="fill"></div></div><div class="level" id="mission"></div><p class="muted" id="counter"></p><h2 id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="primary hidden" id="next" onclick="nextQuestion()">Continuar →</button></section><section id="end" class="hidden center"><div class="reward" id="trophy"></div><h1 id="ending"></h1><p id="summary"></p><p id="medal"></p><div class="actions" style="justify-content:center"><button class="primary" onclick="restart()">Volver a jugar</button><button class="secondary" onclick="window.print()">Imprimir resultado</button></div></section></main><script>
const banks={3:[
['Choose the correct pronoun: Mary is my friend. ___ is happy.',['He','She','They'],1,'Pronouns'],
['Choose: Tom and I = ___',['We','They','He'],0,'Pronouns'],
['Choose: This is ___ book. (I)',['my','his','their'],0,'Possessives'],
['Choose: Anna has a dog. ___ dog is small.',['His','Her','Our'],1,'Possessives'],
['Choose: I ___ football.',['play','plays','playing'],0,'Verbs'],
['Choose: He ___ apples.',['like','likes','liking'],1,'Third person'],
['Choose: She ___ to school.',['walk','walks','walking'],1,'Third person'],
['Choose: ___ you like pizza?',['Do','Does','Is'],0,'Do / Does'],
['Choose: ___ he play tennis?',['Do','Does','Are'],1,'Do / Does'],
['Choose: They ___ two cats.',['has','have','having'],1,'Verbs'],
['Choose: We love ___ teacher.',['our','his','my'],0,'Possessives'],
['Choose: My brother ___ TV.',['watch','watches','watchs'],1,'Third person']
],6:[
['___ your sister speak English?',['Do','Does','Is'],1,'Do / Does'],
['My friends ___ like onions.',['doesn’t','don’t','isn’t'],1,'Do / Does'],
['He ___ his homework every day.',['do','does','doing'],1,'Third person'],
['My mum ___ to work by bus.',['go','goes','gos'],1,'Third person'],
['She ___ football on Saturdays.',['plays','play','playes'],0,'Third person'],
['___ they live in London?',['Does','Do','Are'],1,'Do / Does'],
['Peter ___ watch TV in the morning.',['don’t','doesn’t','isn’t'],1,'Do / Does'],
['Choose the correct sentence.',['Does she likes music?','Does she like music?','Do she like music?'],1,'Questions'],
['This is Sarah. ___ brother is ten.',['His','Her','Their'],1,'Possessives'],
['My parents have a car. ___ car is red.',['Our','Their','Its'],1,'Possessives'],
['Choose the correct sentence.',['He doesn’t plays tennis.','He don’t play tennis.','He doesn’t play tennis.'],2,'Negatives'],
['The dog is eating ___ food.',['its','their','his'],0,'Possessives'],
['Choose the correct pronoun: My sister and I = ___',['They','We','Us'],1,'Pronouns'],
['What time ___ your father get up?',['do','does','is'],1,'Questions'],
['She ___ English every Tuesday.',['studys','studies','study'],1,'Third person'],
['Choose the correct answer: Does Alex swim?',['Yes, he does.','Yes, he do.','Yes, he is.'],0,'Short answers']
]};let grade=3,questions=[],index=0,hearts=3,stars=0,answered=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function show(id){['start','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function startGame(g){grade=g;questions=shuffle(banks[g]);index=0;hearts=3;stars=0;show('game');render()}function render(){answered=false;const q=questions[index];$('grade').textContent=(grade===3?'Segundo ciclo':'6.º de Primaria');$('hearts').textContent='❤️ '+hearts+' vidas';$('stars').textContent='⭐ '+stars+' estrellas';$('progress').style.width=(index/questions.length*100)+'%';$('mission').textContent='Misión '+(Math.floor(index/4)+1)+' · '+q[3];$('counter').textContent='Pregunta '+(index+1)+' de '+questions.length;$('question').textContent=q[0];$('feedback').textContent='';$('next').classList.add('hidden');$('options').replaceChildren();q[1].forEach((answer,i)=>{const b=document.createElement('button');b.className='option';b.textContent=answer;b.onclick=()=>choose(i);$('options').appendChild(b)})}function choose(i){if(answered)return;answered=true;const q=questions[index],ok=i===q[2];if(ok)stars+=10;else hearts--;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('hearts').textContent='❤️ '+hearts+' vidas';$('stars').textContent='⭐ '+stars+' estrellas';$('feedback').textContent=ok?'🎉 ¡Correcto! +10 estrellas':'💡 La respuesta correcta es: '+q[1][q[2]];if((index+1)%4===0&&ok)$('feedback').textContent+=' · 🏅 ¡Misión superada!';$('next').textContent=hearts<=0||index===questions.length-1?'Ver mi resultado →':'Continuar →';$('next').classList.remove('hidden')}function nextQuestion(){index++;if(hearts<=0||index>=questions.length){finish();return}render()}function finish(){show('end');const max=questions.length*10,percent=Math.round(stars/max*100);$('progress').style.width='100%';$('trophy').textContent=percent>=80?'🏆':percent>=50?'🥈':'🌟';$('ending').textContent=percent>=80?'¡Grammar Champion!':percent>=50?'¡Gran aventura!':'¡Sigue practicando!';$('summary').textContent='Has conseguido '+stars+' de '+max+' estrellas ('+percent+'%).';$('medal').textContent=percent>=80?'Medalla de oro desbloqueada 🥇':percent>=50?'Medalla de plata desbloqueada 🥈':'Medalla de explorador desbloqueada 🧭'}function restart(){show('start')}
</script></body></html>
